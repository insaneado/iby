screen_key: hr::勤怠・休暇申請
system: hr
system_name: HR人事給与システム
screen: 勤怠・休暇申請
prefix: la
url: http://127.0.0.1:5132/la
selectors:
  table: '#la-table'
  rows: '#la-table tbody tr'
  note: '#la-note'
  confirm: '#btn-la-ok'
  status: '#status'
columns:
- ID
- 社員ID
- 氏名
- 申請種別
- 期間・詳細
- 部署
- ステータス
pending_value: 申請中
done_value: 承認
subject_column: 申請種別
route_on: 部署
routing:
  # One rule, with the department filled in from the row. An earlier version
  # listed each department seen in the logs as its own key with its own copy of
  # the note, so a department missing from that list got a different note.
  default:
    mode: deterministic
    note_template: '{申請種別} 確認済。{部署}として処理。'
