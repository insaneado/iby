screen_key: hr::経費精算・給与変更
system: hr
system_name: HR人事給与システム
screen: 経費精算・給与変更
prefix: pi
url: http://127.0.0.1:5132/pi
selectors:
  table: '#pi-table'
  rows: '#pi-table tbody tr'
  note: '#pi-note'
  confirm: '#btn-pi-ok'
  status: '#status'
columns:
- ID
- 社員ID
- 氏名
- 区分
- 金額
- 種別
- ステータス
pending_value: 未処理
done_value: 登録済み
subject_column: 区分
amount_column: 金額
route_on: 種別
routing:
  default: &id001
    mode: deterministic
    note_template: '{区分} 確認済。金額 {金額}。定常処理として登録。'
  定常: *id001
  調整:
    mode: review
    # The regulation this screen's operators consult: gyomu_itaku_keihi_kitei is
    # the dominant document across hr__payroll-items segments, and the only
    # approval regulation open while flagged rows are handled (5 of 20 runs).
    # explore/verify_report.py checks every rules_from against that evidence.
    rules_from: gyomu_itaku_keihi_kitei
    note_template: '{区分} 確認済。金額 {金額}。調整区分のため要確認。'
