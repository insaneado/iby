screen_key: hr::経費精算・給与変更
system: hr
system_name: HR人事給与システム
screen: 経費精算・給与変更
prefix: pi
url: http://127.0.0.1:5132/pi
selectors:
  table: '#pi-table'
  rows: '#pi-table tbody tr'
  note: '#pi-note'
  confirm: '#btn-pi-ok'
  status: '#status'
columns:
- ID
- 社員ID
- 氏名
- 区分
- 金額
- 種別
- ステータス
pending_value: 未処理
done_value: 登録済み
subject_column: 区分
amount_column: 金額
route_on: 種別
routing:
  default: &id001
    mode: deterministic
    note_template: '{区分} 確認済。金額 {金額}。定常処理として登録。'
  定常: *id001
  調整:
    mode: review
    # No rules_from, so these rows go to a person. The approval table once used
    # here was the entertainment-expense rules (接待交際費規程), credited to the
    # window its capture was logged under. This screen's operators never have
    # those rules on screen, and the one they open (業務委託経費規程) has no
    # table. explore/verify_report.py checks any rules_from by the rules' title.
    note_template: '{区分} 確認済。金額 {金額}。調整区分のため要確認。'
