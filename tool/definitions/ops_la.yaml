    mode: review
    rules_from: gyomu_itaku_keihi_kitei
    note_template: '{申請種別} 確認済。解除のため要確認。'
  変更:
    mode: deterministic
    note_template: '{申請種別} 確認済。変更として処理。'
  新規締結:
    mode: review
    rules_from: gyomu_itaku_keihi_kitei
    note_template: '{申請種別} 確認済。新規締結のため要確認。'
