screen_key: fin::支払処理
system: fin
system_name: 財務会計システム
screen: 支払処理
prefix: ob
url: http://127.0.0.1:5133/ob
selectors:
  table: '#ob-table'
  rows: '#ob-table tbody tr'
  note: '#ob-note'
  confirm: '#btn-ob-ok'
  status: '#status'
columns:
- ID
- 社員ID
- 氏名
- 入社日
- 部署
- 照合項目数
- ステータス
pending_value: 照合中
done_value: 完了
subject_column: 入社日
route_on: 部署
routing:
  # One rule, with the column's value filled in. On this screen the column
  # headed 部署 holds the invoice being paid and its status ("INV-1693 承認済").
  # An earlier version listed all 48 references seen in the logs as routing
  # keys, each with its own copy of the note - a transcript of the sample,
  # under which the next invoice would have fallen through to another note.
  default:
    mode: deterministic
    note_template: '{入社日} 確認済。{部署}として処理。'
