screen_key: hr::入社手続き
system: hr
system_name: HR人事給与システム
screen: 入社手続き
prefix: ob
url: http://127.0.0.1:5132/ob
selectors:
  table: '#ob-table'
  rows: '#ob-table tbody tr'
  note: '#ob-note'
  confirm: '#btn-ob-ok'
  status: '#status'
columns:
- ID
- 社員ID
- 氏名
- 入社日
- 部署
- 照合項目数
- ステータス
pending_value: 照合中
done_value: 完了
subject_column: 入社日
route_on: 部署
routing:
  # One rule, with the department filled in from the row. An earlier version
  # listed each department seen in the logs as its own key with its own copy of
  # the note, so a department missing from that list got a different note.
  default:
    mode: deterministic
    note_template: '{入社日} 確認済。{部署}として処理。'
