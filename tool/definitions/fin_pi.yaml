screen_key: fin::請求書承認・経費精算
system: fin
system_name: 財務会計システム
screen: 請求書承認・経費精算
prefix: pi
url: http://127.0.0.1:5133/pi
selectors:
  table: '#pi-table'
  rows: '#pi-table tbody tr'
  note: '#pi-note'
  confirm: '#btn-pi-ok'
  status: '#status'
columns:
- ID
- 社員ID
- 氏名
- 区分
- 金額
- 種別
- ステータス
pending_value: 未処理
done_value: 登録済み
subject_column: 区分
amount_column: 金額
route_on: 種別
routing:
  default: &id001
    mode: deterministic
    note_template: '{区分} 確認済。金額 {金額}。定常処理として登録。'
  定常: *id001
  調整:
    mode: review
    rules_from: gyomu_itaku_keihi_kitei
    note_template: '{区分} 確認済。金額 {金額}。調整区分のため要確認。'
