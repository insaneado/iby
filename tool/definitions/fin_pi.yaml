screen_key: fin::請求書承認・経費精算
system: fin
system_name: 財務会計システム
screen: 請求書承認・経費精算
prefix: pi
url: http://127.0.0.1:5133/pi
selectors:
  table: '#pi-table'
  rows: '#pi-table tbody tr'
  note: '#pi-note'
  confirm: '#btn-pi-ok'
  status: '#status'
columns:
- ID
- 社員ID
- 氏名
- 区分
- 金額
- 種別
- ステータス
pending_value: 未処理
done_value: 登録済み
subject_column: 区分
amount_column: 金額
route_on: 種別
routing:
  default: &id001
    mode: deterministic
    note_template: '{区分} 確認済。金額 {金額}。定常処理として登録。'
  定常: *id001
  調整:
    mode: review
    # No rules_from, so these rows go to a person. While handling them the
    # operators consult the monthly fixed-amount supplier list, not an approval
    # regulation: a window titled gyomu_itaku_keihi_kitei was open in 2 of 19
    # flagged runs, the supplier list in 11. Routing them by the thresholds
    # captured under that window - as
    # an earlier version did - automated an approval nobody here is seen
    # making that way. explore/verify_report.py checks every rules_from by the
    # regulation's own printed title on this screen's segments.
    note_template: '{区分} 確認済。金額 {金額}。調整区分のため要確認。'
